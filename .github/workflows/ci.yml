name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  import:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install .
      - run: python -c "import jellyfin; from jellyfin import ApiClient, Configuration; print(jellyfin.__version__)"

  up-to-date:
    # Guards against hand-edits: the committed tree must equal generator output.
    # Skipped on Renovate branches: regenerate.yml commits their output after
    # this workflow has started, and that commit does not retrigger CI.
    if: ${{ !startsWith(github.head_ref, 'renovate/') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - run: ./generate.sh
      - run: git diff --exit-code
